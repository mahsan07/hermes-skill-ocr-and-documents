<svg xmlns="http://www.w3.org/2000/svg" width="860" height="868" viewBox="0 0 860 868" role="img" aria-labelledby="title desc">
  <title id="title">OCR and Documents workflow</title>
  <desc id="desc">A 6-step vertical workflow for OCR and Documents.</desc>
  <rect width="860" height="868" rx="28" fill="#F8FAFC"/>
  <style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  <rect x="0" y="0" width="860" height="14" rx="7" fill="#C2410C"/>
<text x="60" y="72" font-size="15" font-weight="750" fill="#C2410C"><tspan x="60" dy="0">HOW THE WORKFLOW MOVES</tspan></text>
<text x="60" y="118" font-size="32" font-weight="750" fill="#0F172A"><tspan x="60" dy="0">OCR and Documents</tspan></text>
  <rect x="60" y="166" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="209" r="24" fill="#FFEDD5"/>
  <text x="99" y="217" font-size="22" font-weight="750" fill="#C2410C">1</text>
<text x="150" y="203" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Confirm the target service and requested operation</tspan></text>
  <path d="M106 252 V281" stroke="#C2410C" stroke-width="3"/>
  <rect x="60" y="284" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="327" r="24" fill="#FFEDD5"/>
  <text x="99" y="335" font-size="22" font-weight="750" fill="#C2410C">2</text>
<text x="150" y="321" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Check access without exposing credentials</tspan></text>
  <path d="M106 370 V399" stroke="#C2410C" stroke-width="3"/>
  <rect x="60" y="402" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="445" r="24" fill="#FFEDD5"/>
  <text x="99" y="453" font-size="22" font-weight="750" fill="#C2410C">3</text>
<text x="150" y="439" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Inspect current state and narrow the target</tspan></text>
  <path d="M106 488 V517" stroke="#C2410C" stroke-width="3"/>
  <rect x="60" y="520" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="563" r="24" fill="#FFEDD5"/>
  <text x="99" y="571" font-size="22" font-weight="750" fill="#C2410C">4</text>
<text x="150" y="557" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Preview any consequential change</tspan></text>
  <path d="M106 606 V635" stroke="#C2410C" stroke-width="3"/>
  <rect x="60" y="638" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="681" r="24" fill="#FFEDD5"/>
  <text x="99" y="689" font-size="22" font-weight="750" fill="#C2410C">5</text>
<text x="150" y="675" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Execute only the approved bounded action</tspan></text>
  <path d="M106 724 V753" stroke="#C2410C" stroke-width="3"/>
  <rect x="60" y="756" width="740" height="86" rx="17" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="106" cy="799" r="24" fill="#FFEDD5"/>
  <text x="99" y="807" font-size="22" font-weight="750" fill="#C2410C">6</text>
<text x="150" y="793" font-size="20" font-weight="600" fill="#1E293B"><tspan x="150" dy="0">Re-read the target and report the verified result</tspan></text>
</svg>
